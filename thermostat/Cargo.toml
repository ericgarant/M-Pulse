[package]
name = "m-pulse-thermostat"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "M-Pulse thermostat node: DHT11 sensing and BLE control of a BougeRV diesel heater"
license = "MIT"
publish = false

[[bin]]
name = "m-pulse-thermostat"
harness = false # the ESP-IDF target has no test harness

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z" # unoptimised builds are too large and too slow for the ESP32

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
esp32-nimble = "0.13"
dht-sensor = "0.3"
embedded-hal = "1"
embassy-futures = "0.1"

[build-dependencies]
embuild = "0.33"
