[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# `cargo run` flashes the board and opens the serial monitor.
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

# ESP32-S3 (the hub board). Build with:
#   MCU=esp32s3 cargo build --release --target xtensa-esp32s3-espidf
[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# ESP-IDF is downloaded and built automatically on the first `cargo build`.
ESP_IDF_VERSION = "v5.5.3"
