[package]
name = "m-pulse-camera-node"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "M-Pulse camera node (ESP32-WROVER with OV3660): on-demand MJPEG video for the hub's dashboard"
license = "MIT"
publish = false

[[bin]]
name = "m-pulse-camera-node"
harness = false # the ESP-IDF target has no test harness

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z" # unoptimised builds are too large and too slow for the ESP32

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
m-pulse-core = { path = "../core" }

[build-dependencies]
embuild = "0.33"

# The camera driver, patched for ESP-IDF 5.5 (see components/esp32_camera/M_PULSE_PATCH.md).
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/esp32_camera"]
bindings_header = "src/camera_bindings.h"
bindings_module = "camera"
