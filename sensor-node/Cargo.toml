[package]
name = "m-pulse-sensor-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "M-Pulse sensor node (ESP32): DHT11 cabin readings sent to the hub over Wi-Fi"
license = "MIT"
publish = false

[[bin]]
name = "m-pulse-sensor-node"
harness = false # the ESP-IDF target has no test harness

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z" # unoptimised builds are too large and too slow for the ESP32

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
dht-sensor = "0.3"
embedded-hal = "1"
m-pulse-core = { path = "../core" }

[build-dependencies]
embuild = "0.33"
